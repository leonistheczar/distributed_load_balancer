[project]
name = "load-balancer-sim"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "black", "ruff"]

